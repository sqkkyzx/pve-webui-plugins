# Merge into your EXISTING Nginx configuration. Replace example names/paths.
# This file does not install another Nginx or change files on PVE.
# The map/upstream blocks belong in the http context, outside server {}.
map $http_upgrade $pve_plugins_connection_upgrade {
    default upgrade;
    '' close;
}

upstream pve_original {
    server pve.example.internal:8006;
}

upstream pve_plugins_backend {
    # If Nginx is on another machine/container, use a reachable internal
    # address and publish/connect the extension service accordingly.
    server 127.0.0.1:18080;
}

server {
    listen 443 ssl;
    server_name pve-enhanced.example.com;
    ssl_certificate /etc/nginx/certs/pve-enhanced.crt;
    ssl_certificate_key /etc/nginx/certs/pve-enhanced.key;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pve_plugins_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 0;

    # Trust PVE's actual CA and verify its certificate name.
    proxy_ssl_server_name on;
    proxy_ssl_name pve.example.internal;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/certs/pve-ca.pem;

    # Only the HTML entry point goes through FastAPI. It skips console/mobile
    # pages based on the original query string, which proxy_pass preserves.
    location = / {
        proxy_pass http://pve_plugins_backend;
        proxy_cache off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @pve_plain_desktop;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    location ^~ /pve-plugins/ {
        proxy_pass http://pve_plugins_backend;
        proxy_cache off;
    }

    # Retain the original API and asset prefix for existing installations.
    location ^~ /pve-komodo/ {
        proxy_pass http://pve_plugins_backend;
        proxy_cache off;
    }

    # APIs, uploads, downloads, official assets, and console WebSockets keep
    # their existing PVE route. No body substitution or API relay in FastAPI.
    location / {
        proxy_pass https://pve_original;
    }

    # If the extension container is down, still serve PVE's original desktop.
    location @pve_plain_desktop {
        proxy_pass https://pve_original;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }
}
