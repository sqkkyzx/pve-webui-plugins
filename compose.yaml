services:
  pve-webui-plugins:
    image: ${PVE_PLUGINS_IMAGE:-pve-webui-plugins:local}
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    environment:
      PVE_UPSTREAM: ${PVE_UPSTREAM:?Set the PVE node IP or comma-separated node IPs}
      PVE_PLUGINS_INJECTION_ENABLED: ${PVE_PLUGINS_INJECTION_ENABLED:-true}
      PVE_TLS_VERIFY: ${PVE_TLS_VERIFY:-false}
      PVE_CA_FILE: ${PVE_CA_FILE:-}
      PVE_TLS_SERVER_NAMES: ${PVE_TLS_SERVER_NAMES:-}
      PVE_ADMIN_USERS: ${PVE_ADMIN_USERS:-root@pam}
      PVE_INTERNAL_PROXY_ENABLED: ${PVE_INTERNAL_PROXY_ENABLED:-true}
      PVE_TRUSTED_PROXIES: ${PVE_TRUSTED_PROXIES:-}
      PVE_PROXY_CERT_FILE: ${PVE_PROXY_CERT_FILE:-}
      PVE_PROXY_KEY_FILE: ${PVE_PROXY_KEY_FILE:-}
    volumes:
      - pve_webui_plugins_data:/app/data
    tmpfs:
      - /run/pve-webui-plugins:rw,noexec,nosuid,size=8m,uid=10001,gid=10001,mode=0700
    ports:
      - "${PVE_PROXY_BIND:-0.0.0.0}:${PVE_PROXY_PORT:-8006}:8006"
      - "${PVE_PLUGINS_BIND:-127.0.0.1}:${PVE_PLUGINS_PORT:-8008}:8008"
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local

volumes:
  pve_webui_plugins_data:
